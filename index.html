<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEVI Saúde</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PEVI Saúde</h1>
        <p>
            Perfil do Estilo de Vida Individual
        </p>
    </header>

<!--ALTERAÇÃO:
Antes todas as perguntas eram exibidas em uma única tela.
Pensei em dividir o questionário em etapas, para não ficar muita informação de uma só vez para o usuário. -->

<main>

<!--TELA INICIAL:
Quis criar uma tela inicial que simulasse um fluxo de login/identificação do usuário.
Torna a aplicação mais intuitiva e organizada e não precisa alterar o backend. -->

    <section id="telaInicial" class="card">

        <h2>Avaliação do Estilo de Vida</h2>

        <p>
            Responda ao questionário PEVI para receber
            uma análise do seu perfil de saúde e bem-estar.
        </p>

        <input
            type="text"
            id="nome"
            placeholder="Nome completo">

        <input
            type="email"
            id="email"
            placeholder="E-mail">

        <input
            type="number"
            id="idUsuario"
            placeholder="ID do usuário">

        <button id="iniciarBtn">
            Iniciar Avaliação
        </button>

    </section>

   <!--QUESTIONÁRIO: 
   Separei por categorias do PEVI -->
 
    <section
        id="telaQuestionario"
        class="card"
        style="display:none;">

        <div class="cabecalho-etapa">

            <h2 id="tituloCategoria"></h2>

            <!--
            Exibe a etapa atual.

            Exemplo:
            Etapa 2 de 5
            -->
            <span id="contadorEtapa"></span>

        </div>

        <!--
        Barra de progresso para permitir que o usuário acompanhe visualmente o avanço do questionário.
        -->
        <div class="progresso">

            <div id="barra"></div>

        </div>


        <div id="perguntasEtapa"></div>

            <div class="acoes">

            <button
                type="button"
                id="voltarBtn">

                ← Voltar

            </button>

            <button
                type="button"
                id="proximoBtn">

                Próximo →

            </button>

        </div>

    </section>

<!--TELA DE RESULTADOS: 
Separação da visualização do gráfico em uma tela exclusiva. -->

    <section
        id="resultado"
        class="card"
        style="display:none;">

        <h2>
            Resultado da Avaliação
        </h2>

        <div id="graficoContainer"></div>

        <button
            id="reiniciarBtn"
            type="button">

            Fazer Nova Avaliação

        </button>

    </section>

</main>
    <script src="app.js"></script>

</body>
</html>
