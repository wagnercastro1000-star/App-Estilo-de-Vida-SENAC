<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEVI Saúde</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PEVI Saúde</h1>
        <p>
            Perfil do Estilo de Vida Individual
        </p>
    </header>

    <main>

        <section class="intro">
            <h2>Avaliação de Saúde e Bem-Estar</h2>

            <p>
                Responda às perguntas abaixo para gerar seu
                perfil comportamental e visualizar seus resultados.
            </p>

            <label for="idUsuario">
                ID do Usuário
            </label>

            <input
                type="number"
                id="idUsuario"
                placeholder="Digite seu ID">
        </section>

        <form id="questionario">

            <div id="perguntas-container"></div>

            <div class="botao-container">
                <button type="button" id="enviarBtn">
                    Gerar Feedback
                </button>
            </div>

        </form>

        <section id="resultado"></section>

    </main>

    <script src="app.js"></script>

</body>

</html>
